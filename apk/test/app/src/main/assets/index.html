<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EGG Chat Test</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: #0b0f14; color: #e6edf3;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid #182230;
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 700; }
    header h1 b { color: #ffd166; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8b98a5; flex: 0 0 auto; }
    .dot.ready { background: #3fb950; }
    .dot.load { background: #d29922; }
    .dot.err { background: #f85149; }
    header small { color: #8b98a5; font-size: 11px; margin-left: auto; }
    #list { flex: 1 1 auto; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 84%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
    .msg.user { align-self: flex-end; background: #1f6feb; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #161d27; border: 1px solid #22303f; border-bottom-left-radius: 4px; }
    .msg.bot.typing::after { content: "\2588"; color: #ffd166; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sys { align-self: center; color: #8b98a5; font-size: 12px; text-align: center; margin: 2px 0; max-width: 90%; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #182230; display: flex; gap: 8px; background: #0b0f14; flex: 0 0 auto; }
    #in { flex: 1 1 auto; resize: none; background: #10161d; color: #e6edf3; border: 1px solid #22303f; border-radius: 10px; padding: 10px 12px; font: inherit; max-height: 120px; }
    #send { background: #ffd166; color: #10161d; border: 0; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 700; }
    #send:disabled { opacity: .4; }
  </style>
  <script type="module" crossorigin src="./assets/index-Z7lYR0Iu.js"></script>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Qwen2.5&nbsp;<b>0.5B</b> &middot; on-device chat</h1>
    <small id="state">booting...</small>
  </header>
  <main id="list"></main>
  <footer>
    <textarea id="in" rows="1" placeholder="Message the on-device model..."></textarea>
    <button id="send" disabled>Send</button>
  </footer>
</body>
</html>
